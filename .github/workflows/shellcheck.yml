name: shellcheck

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck payloads
        # SC2140: payloads intentionally join quoted XML strings across lines
        run: |
          find library \( -name payload.sh -o -path '*/include/*.sh' \) -print0 | \
            xargs -0 shellcheck -S warning -e SC2034,SC2155,SC2140
      - name: Python and JavaScript syntax
        run: |
          find library -name '*.py' -print0 | xargs -0 python3 -m py_compile
          find library -path '*/web/static/*.js' ! -path '*/leaflet/*' -print0 | xargs -0 -n1 node --check
